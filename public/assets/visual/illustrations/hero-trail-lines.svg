xt x="20" y="71" font-family="'Chivo Mono', monospace" font-size="6" letter-spacing="2" fill="rgba(240,237,230,0.3)" data-astro-cid-vn4tu6jo="">YOUR MACHINE</text> <!-- YOUR CODE input (left) --> <g class="svg-card" data-astro-cid-vn4tu6jo=""> <rect x="20" y="100" width="110" height="50" fill="rgba(10,10,10,0.95)" stroke="rgba(240,237,230,0.15)" stroke-width="1" data-astro-cid-vn4tu6jo=""/> <text x="75" y="121" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="7" letter-spacing="1.5" fill="rgba(240,237,230,0.4)" class="card-title" data-astro-cid-vn4tu6jo="">YOUR CODE</text> <text x="75" y="133" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="5.5" letter-spacing="1" fill="rgba(240,237,230,0.25)" class="card-sub" data-astro-cid-vn4tu6jo="">KEYSTROKES · FILES</text> </g> <!-- Connector: Code → RIG (active flow) --> <line x1="130" y1="125" x2="193" y2="125" stroke="rgba(34,197,94,0.15)" stroke-width="1" pointer-events="none" data-astro-cid-vn4tu6jo=""/> <!-- Shooting star 1: Code → RIG --> <rect x="-1.5" y="-1.5" width="3" height="3" fill="#22c55e" pointer-events="none" data-astro-cid-vn4tu6jo=""> <animateMotion dur="2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" data-astro-cid-vn4tu6jo=""> <mpath href="#path-code-rig" data-astro-cid-vn4tu6jo=""/> </animateMotion> <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2s" repeatCount="indefinite" data-astro-cid-vn4tu6jo=""/> </rect> <!-- Trail line --> <line x1="130" y1="125" x2="193" y2="125" stroke="url(#trail-h1)" stroke-width="2" pointer-events="none" data-astro-cid-vn4tu6jo=""> <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" data-astro-cid-vn4tu6jo=""/> </line> <!-- RIG core (center, prominent) --> <g class="svg-card" data-astro-cid-vn4tu6jo=""> <rect x="193" y="78" width="160" height="94" fill="rgba(10,10,10,0.95)" stroke="rg